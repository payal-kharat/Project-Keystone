apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app3-db

  template:
    metadata:
      labels:
        app: app3-db

    spec:
      containers:
        - name: mysql
          image: docker.io/payalkharat/kubernetes-ingress:app3-db

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app3-db-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app3-db-config
                  key: MYSQL_DATABASE

          args:
            - --default-authentication-plugin=mysql_native_password

          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: app3-db-pvc
