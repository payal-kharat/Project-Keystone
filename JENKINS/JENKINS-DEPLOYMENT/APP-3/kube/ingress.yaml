apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3-ingress
  
  annotations:
    haproxy.org/path-rewrite: |
      ^/api$ /
spec:
  ingressClassName: haproxy
  rules:
    - host: app3.local.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app3-backend
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-frontend
                port:
                  number: 80
