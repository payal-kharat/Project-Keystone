apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
 

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app4-backend

  template:
    metadata:
      labels:
        app: app4-backend

    spec:
      containers:
        - name: backend
          image: docker.io/payalkharat/kubernetes-ingress:app4-backend

          ports:
            - containerPort: 8000

          env:
          
            - name: ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: app4-backend-config
                  key: ADDRESS

            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: app4-backend-config
                  key: RUST_LOG

            - name: PG_DBNAME
              valueFrom:
                configMapKeyRef:
                  name: app4-backend-config
                  key: PG_DBNAME

            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: app4-backend-config
                  key: PG_HOST

            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: app4-backend-config
                  key: PG_USER


            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app4-db-secret
                  key: PG_PASSWORD
