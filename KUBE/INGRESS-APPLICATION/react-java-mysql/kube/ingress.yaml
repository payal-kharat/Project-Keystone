apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3-ingress
  namespace: app-3
spec:
  ingressClassName: haproxy

  rules:
    - host: app3.local.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-frontend
                port:
                  number: 80
