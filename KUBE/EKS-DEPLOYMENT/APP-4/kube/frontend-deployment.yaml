apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-4
spec:
  replicas: 1

  selector:
    matchLabels:
      app: app4-frontend

  template:
    metadata:
      labels:
        app: app4-frontend

    spec:
      containers:
        - name: app4-frontend
          image: docker.io/payalkharat/kubernetes-ingress:app4-frontend 
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          
