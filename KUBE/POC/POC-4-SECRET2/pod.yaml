apiVersion: v1
kind: Pod
metadata:
  name: secret-subpath
spec:
  containers:
    - name: toolbox
      image: docker.io/payalkharat/kubernetes-toolbox:latest
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/app/secret-password
          subPath: password
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
        defaultMode: 0400
        items:
          - key: password
            path: password